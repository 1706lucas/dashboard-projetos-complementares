name: Publicar dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"   # 07:00 de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20

      - name: Buscar dados no ClickUp
        if: github.event_name != 'push'
        run: node .github/scripts/atualizar-clickup.mjs
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          DASH_KEY: ${{ secrets.DASH_KEY }}

      - name: Salvar no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json.enc data/historico.json.enc
          git diff --cached --quiet || (git commit -m "Dados do ClickUp $(date -u +%F)" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
