name: Publicar dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10-22/2 * * 1-5"   # dias úteis: 07h, 09h, 11h, 13h, 15h, 17h e 19h de Brasília
    - cron: "0 10 * * 0,6"        # sábado e domingo: 07h de Brasília
  workflow_dispatch:

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  # 1) lê o ClickUp, salva os dados e empacota o site
  preparar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      alerta: ${{ steps.robo.outputs.alerta }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        if: github.event_name != 'push'
        with:
          node-version: 22

      - name: Buscar dados no ClickUp
        id: robo
        if: github.event_name != 'push'
        run: node .github/scripts/atualizar-clickup.mjs
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          DASH_KEY: ${{ secrets.DASH_KEY }}

      - name: Salvar no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json.enc data/historico.json.enc
          if git diff --cached --quiet; then echo "Sem mudanças nos dados."; exit 0; fi
          git commit -m "Dados do ClickUp $(date -u +'%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Tentativa $i falhou, tentando de novo em 20 s"; sleep 20
          done
          exit 1

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

  # 2) publica em job separado (contorna a falha "No artifacts named github-pages" do GitHub)
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5

      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Aguardar antes da 2ª tentativa
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

  # 3) alerta: execução marcada como falha quando o cronograma não foi lido (o GitHub envia o e-mail)
  alerta:
    needs: [preparar, publicar]
    if: always() && needs.preparar.outputs.alerta != ''
    runs-on: ubuntu-latest
    steps:
      - name: Alerta - leitura do ClickUp incompleta
        env:
          ALERTA: ${{ needs.preparar.outputs.alerta }}
        run: |
          echo "::error title=Dashboard com dados antigos::$ALERTA"
          exit 1
