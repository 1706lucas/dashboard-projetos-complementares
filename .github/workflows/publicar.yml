name: Publicar dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10-22/2 * * 1-5"   # dias úteis: 07h, 09h, 11h, 13h, 15h, 17h e 19h de Brasília
    - cron: "0 10 * * 0,6"        # sábado e domingo: 07h de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 20

      - name: Buscar dados no ClickUp
        id: robo
        if: github.event_name != 'push'
        run: node .github/scripts/atualizar-clickup.mjs
        env:
          CLICKUP_TOKEN: ${{ secrets.CLICKUP_TOKEN }}
          DASH_KEY: ${{ secrets.DASH_KEY }}

      - name: Salvar no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json.enc data/historico.json.enc
          if git diff --cached --quiet; then echo "Sem mudanças nos dados."; exit 0; fi
          git commit -m "Dados do ClickUp $(date -u +'%F %H:%M')"
          # se alguém subiu arquivos enquanto o robô rodava, junta antes de enviar (antes isso derrubava a atualização)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Tentativa $i falhou, tentando de novo em 20 s"; sleep 20
          done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

      # Publica mesmo assim e, no fim, marca a execução como FALHA quando o cronograma não foi lido.
      # Execução com falha = e-mail automático do GitHub para o dono do repositório.
      - name: Alerta - leitura do ClickUp incompleta
        if: steps.robo.outputs.alerta != ''
        env:
          ALERTA: ${{ steps.robo.outputs.alerta }}
        run: |
          echo "::error title=Dashboard com dados antigos::$ALERTA"
          exit 1
